<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#126f9f"/>
    </marker>
    <marker id="circulate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#175c72"/>
    </marker>
    <pattern id="remove" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fde9e6"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#d15445" stroke-width="3"/>
    </pattern>
    <pattern id="joint" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c05c4d" stroke-width="3"/>
    </pattern>
    <style>
      .title { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 31px; font-weight: 700; fill: #202326; }
      .sub { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 16px; fill: #5b6167; }
      .h2 { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 22px; font-weight: 700; fill: #202326; }
      .label { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 16px; fill: #2e3338; }
      .small { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 13px; fill: #555c62; }
      .tiny { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 11px; fill: #646b71; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#f7f5f0"/>
  <text x="55" y="52" class="title">按现有户型改建：保留原二层，蓝色新楼连续倒U形</text>
  <text x="55" y="82" class="sub">现状拆保、一层落地和二层连接分别表达；后楼、左翼、短右翼均属于统一的新结构</text>

  <!-- TOP PANELS -->
  <rect x="35" y="115" width="850" height="565" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <rect x="915" y="115" width="850" height="565" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="60" y="153" class="h2">A 当前户型与拆保范围</text>
  <text x="940" y="153" class="h2">B 改建后一层：蓝色L形落地</text>

  <!-- ================= A CURRENT ================= -->
  <!-- neighbour -->
  <rect x="65" y="205" width="165" height="390" fill="#e8e8e8" stroke="#303337" stroke-width="4"/>
  <text x="147" y="388" text-anchor="middle" class="label">邻居</text>
  <text x="147" y="414" text-anchor="middle" class="tiny">建筑贴近你的左墙</text>

  <!-- user boundary based on current sketch -->
  <path d="M230 205 L700 205 L700 335 L840 335 L840 595 L230 595 Z" fill="#fffdf8" stroke="#202326" stroke-width="4"/>
  <text x="245" y="226" class="tiny">你的土地 / 围墙范围</text>

  <!-- rear tiled rooms to remove -->
  <rect x="230" y="210" width="350" height="75" fill="url(#remove)" stroke="#d15445" stroke-width="3"/>
  <line x1="305" y1="210" x2="305" y2="285" stroke="#d15445" stroke-width="2"/>
  <line x1="390" y1="210" x2="390" y2="285" stroke="#d15445" stroke-width="2"/>
  <line x1="480" y1="210" x2="480" y2="285" stroke="#d15445" stroke-width="2"/>
  <text x="405" y="254" text-anchor="middle" class="small" fill="#a13c32">后排一层瓦房/杂物间：拆除</text>

  <!-- back yard -->
  <text x="460" y="315" text-anchor="middle" class="label">后院</text>

  <!-- current ditch -->
  <line x1="210" y1="330" x2="858" y2="330" stroke="#18a6db" stroke-width="14" marker-end="url(#flow)"/>
  <text x="500" y="322" text-anchor="middle" class="small" fill="#126f9f">现状混合水沟：左 → 右</text>

  <!-- kitchen/dining to remove -->
  <rect x="230" y="350" width="120" height="245" fill="url(#remove)" stroke="#d15445" stroke-width="3"/>
  <line x1="230" y1="485" x2="350" y2="485" stroke="#d15445" stroke-width="2"/>
  <text x="290" y="418" text-anchor="middle" class="small" fill="#a13c32">一层厨房</text>
  <text x="290" y="530" text-anchor="middle" class="small" fill="#a13c32">一层饭厅</text>
  <text x="290" y="560" text-anchor="middle" class="tiny" fill="#a13c32">拆除后退墙重建</text>

  <!-- old two-story retained -->
  <rect x="350" y="350" width="350" height="245" fill="#ff8a34" stroke="#a84c16" stroke-width="4"/>
  <line x1="470" y1="350" x2="470" y2="595" stroke="#a84c16" stroke-width="3"/>
  <line x1="610" y1="350" x2="610" y2="595" stroke="#a84c16" stroke-width="3"/>
  <text x="525" y="455" text-anchor="middle" class="label" fill="#84370f">原二层楼：保留</text>
  <text x="525" y="483" text-anchor="middle" class="small" fill="#84370f">楼梯、厅堂、房间</text>
  <text x="525" y="510" text-anchor="middle" class="tiny" fill="#84370f">先鉴定旧石基础和地面下沉</text>

  <!-- right one-story storage retained -->
  <rect x="700" y="350" width="120" height="245" fill="#eadfcf" stroke="#735d43" stroke-width="4"/>
  <text x="760" y="455" text-anchor="middle" class="small" fill="#604d36">原一层</text>
  <text x="760" y="480" text-anchor="middle" class="small" fill="#604d36">杂物房</text>
  <text x="760" y="510" text-anchor="middle" class="tiny" fill="#604d36">保留</text>

  <!-- current right gate -->
  <rect x="691" y="280" width="20" height="50" fill="#fffdf8"/>
  <line x1="700" y1="286" x2="680" y2="307" stroke="#765d43" stroke-width="3"/>
  <line x1="700" y1="326" x2="680" y2="309" stroke="#765d43" stroke-width="3"/>
  <text x="720" y="290" class="tiny" fill="#765d43">后院右侧门</text>

  <!-- legend A -->
  <rect x="65" y="622" width="30" height="20" fill="url(#remove)" stroke="#d15445" stroke-width="2"/>
  <text x="105" y="638" class="tiny">斜纹红：拆除重建</text>
  <rect x="270" y="622" width="30" height="20" fill="#ff8a34" stroke="#a84c16" stroke-width="2"/>
  <text x="310" y="638" class="tiny">橙色：原二层保留</text>
  <rect x="495" y="622" width="30" height="20" fill="#eadfcf" stroke="#735d43" stroke-width="2"/>
  <text x="535" y="638" class="tiny">米色：右侧一层保留</text>

  <!-- ================= B FIRST FLOOR ================= -->
  <!-- neighbour -->
  <rect x="945" y="205" width="150" height="390" fill="#e8e8e8" stroke="#303337" stroke-width="4"/>
  <text x="1020" y="390" text-anchor="middle" class="label">邻居</text>
  <text x="1020" y="416" text-anchor="middle" class="tiny">左墙外既有建筑</text>

  <!-- property -->
  <path d="M1100 205 L1570 205 L1570 335 L1710 335 L1710 595 L1100 595 Z" fill="#fffdf8" stroke="#a93632" stroke-width="5"/>
  <text x="1115" y="226" class="tiny" fill="#a93632">保留围墙</text>

  <!-- left boundary passage -->
  <rect x="1118" y="250" width="42" height="330" fill="#eaf4e5" stroke="#769b6e" stroke-width="2"/>
  <text x="1139" y="422" text-anchor="middle" class="tiny" fill="#416b43" transform="rotate(-90 1139 422)">约1～1.2米围墙通道</text>

  <!-- rear passage -->
  <rect x="1170" y="235" width="370" height="28" fill="#edf4e9" stroke="#8da18a" stroke-width="2"/>
  <text x="1355" y="254" text-anchor="middle" class="tiny" fill="#527054">后侧约0.8～1米检修带</text>

  <!-- continuous new L first floor -->
  <path d="M1175 275 L1545 275 L1545 390 L1255 390 L1255 575 L1175 575 Z" fill="#9dd7e8" stroke="#25748a" stroke-width="4"/>
  <text x="1375" y="323" text-anchor="middle" class="label" fill="#18566a">新建后楼一层</text>
  <text x="1375" y="348" text-anchor="middle" class="small" fill="#25748a">厅房 / 湿区 / 管井</text>
  <text x="1215" y="447" text-anchor="middle" class="small" fill="#18566a">新厨房</text>
  <text x="1215" y="470" text-anchor="middle" class="tiny" fill="#18566a">餐区</text>
  <line x1="1175" y1="495" x2="1255" y2="495" stroke="#25748a" stroke-width="3"/>
  <text x="1215" y="530" text-anchor="middle" class="small" fill="#18566a">独立楼梯</text>
  <text x="1215" y="553" text-anchor="middle" class="tiny" fill="#18566a">通往蓝色二层U形</text>
  <text x="1285" y="378" class="tiny" fill="#18566a">左后转角连续，不断开</text>

  <!-- courtyard -->
  <rect x="1275" y="405" width="265" height="140" fill="#eaf4e5" stroke="#769b6e" stroke-width="3"/>
  <text x="1407" y="458" text-anchor="middle" class="label" fill="#416b43">中庭 / 天井</text>
  <text x="1407" y="483" text-anchor="middle" class="small" fill="#527054">净深约3～4米</text>
  <text x="1407" y="507" text-anchor="middle" class="tiny" fill="#527054">露天、采光、通风</text>
  <text x="1407" y="529" text-anchor="middle" class="tiny" fill="#527054">雨水单排，不走污水</text>

  <!-- old building retained first floor -->
  <rect x="1275" y="555" width="300" height="40" fill="#ff8a34" stroke="#a84c16" stroke-width="4"/>
  <text x="1425" y="580" text-anchor="middle" class="small" fill="#84370f">原二层楼的一层：保留</text>

  <!-- new-old structural joint -->
  <rect x="1255" y="555" width="20" height="40" fill="url(#joint)" stroke="#c05c4d" stroke-width="1"/>
  <text x="1265" y="612" text-anchor="middle" class="tiny" fill="#a33d32">结构缝</text>

  <!-- retained storage -->
  <rect x="1585" y="435" width="105" height="160" fill="#eadfcf" stroke="#735d43" stroke-width="3"/>
  <text x="1637" y="500" text-anchor="middle" class="small" fill="#604d36">原一层</text>
  <text x="1637" y="523" text-anchor="middle" class="small" fill="#604d36">杂物房</text>
  <text x="1637" y="548" text-anchor="middle" class="tiny" fill="#604d36">不承托新二层</text>

  <!-- right gate and ground passage -->
  <rect x="1560" y="285" width="22" height="48" fill="#fffdf8"/>
  <line x1="1570" y1="291" x2="1552" y2="308" stroke="#765d43" stroke-width="3"/>
  <line x1="1570" y1="328" x2="1552" y2="310" stroke="#765d43" stroke-width="3"/>
  <text x="1590" y="288" class="tiny" fill="#765d43">右侧门保留</text>
  <rect x="1548" y="395" width="28" height="145" fill="#f3f6f0" stroke="#a4b69e" stroke-width="2"/>
  <text x="1562" y="466" text-anchor="middle" class="tiny" fill="#5c7659" transform="rotate(90 1562 466)">一层通道</text>

  <!-- right wing supporting columns -->
  <circle cx="1538" cy="395" r="8" fill="#25748a"/>
  <circle cx="1538" cy="535" r="8" fill="#25748a"/>
  <line x1="1538" y1="395" x2="1538" y2="535" stroke="#25748a" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1525" y="469" text-anchor="middle" class="tiny" fill="#25748a" transform="rotate(-90 1525 469)">短右翼新柱</text>

  <!-- old and new drain -->
  <line x1="1095" y1="545" x2="1705" y2="545" stroke="#58b9dc" stroke-width="9" stroke-dasharray="18 10" opacity="0.65"/>
  <text x="1410" y="553" text-anchor="middle" class="tiny" fill="#126f9f">原沟位置：新管通水后停用</text>
  <path d="M1095 390 L1139 390 L1139 235 L1170 235 L1170 190" fill="none" stroke="#126f9f" stroke-width="11"/>
  <path d="M1170 190 L1578 190 L1590 210 L1590 335 L1710 350 L1710 505" fill="none" stroke="#126f9f" stroke-width="11" marker-end="url(#flow)"/>
  <circle cx="1139" cy="390" r="9" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="1170" cy="190" r="9" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="1590" cy="335" r="9" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <text x="1350" y="184" text-anchor="middle" class="tiny" fill="#126f9f">邻居侧内接，单点穿墙后沿外侧走</text>
  <rect x="1680" y="485" width="72" height="45" rx="3" fill="#ed3434" stroke="#9b1c1c" stroke-width="2"/>
  <text x="1716" y="503" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="700" fill="#fff">公共水道</text>
  <text x="1716" y="519" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#fff">接入口</text>

  <!-- ================= C SECOND FLOOR ================= -->
  <rect x="175" y="710" width="1450" height="385" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="200" y="748" class="h2">C 改建后二层：蓝色三段连续组成不对称倒U</text>

  <!-- second-floor property -->
  <path d="M370 780 L1240 780 L1240 900 L1435 900 L1435 1050 L370 1050 Z" fill="#fffdf8" stroke="#a93632" stroke-width="5"/>

  <!-- continuous U-shaped blue structure -->
  <path d="M470 815 L1180 815 L1180 960 L1080 960 L1080 900 L620 900 L620 1040 L470 1040 Z" fill="#9dd7e8" stroke="#25748a" stroke-width="5"/>
  <line x1="620" y1="900" x2="620" y2="1040" stroke="#25748a" stroke-width="3"/>
  <line x1="1080" y1="900" x2="1080" y2="960" stroke="#25748a" stroke-width="3"/>

  <!-- emphasize connected rear corners -->
  <circle cx="620" cy="900" r="16" fill="#25748a"/>
  <circle cx="1080" cy="900" r="16" fill="#25748a"/>
  <text x="640" y="887" class="tiny" fill="#18566a">左后转角连续</text>
  <text x="990" y="887" class="tiny" fill="#18566a">右后转角连续</text>

  <!-- labels inside U -->
  <text x="825" y="850" text-anchor="middle" class="label" fill="#18566a">蓝色后楼二层：房间 / 厅 / 卫生间</text>
  <text x="545" y="952" text-anchor="middle" class="small" fill="#18566a" transform="rotate(-90 545 952)">左翼二层：房间＋楼梯厅</text>
  <text x="1130" y="929" text-anchor="middle" class="tiny" fill="#18566a" transform="rotate(90 1130 929)">短右翼：走廊/书房</text>

  <!-- circulation line -->
  <path d="M535 1005 L535 855 L1125 855 L1125 930" fill="none" stroke="#175c72" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#circulate)"/>
  <text x="825" y="874" text-anchor="middle" class="tiny" fill="#175c72">蓝色内部连续通行：左翼 → 后楼 → 短右翼</text>

  <!-- courtyard opening -->
  <rect x="640" y="915" width="420" height="85" fill="#fff" stroke="#769b6e" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="850" y="950" text-anchor="middle" class="label" fill="#416b43">中庭挑空口</text>
  <text x="850" y="977" text-anchor="middle" class="tiny" fill="#527054">保持露天，不封顶；净深约3～4米</text>

  <!-- retained old second floor -->
  <rect x="640" y="1010" width="440" height="30" fill="#ff8a34" stroke="#a84c16" stroke-width="4"/>
  <text x="860" y="1031" text-anchor="middle" class="small" fill="#84370f">橙色原二层：保留，独立结构</text>

  <!-- joint between new left wing and old building -->
  <rect x="620" y="1010" width="20" height="30" fill="url(#joint)" stroke="#c05c4d" stroke-width="1"/>
  <text x="630" y="1068" text-anchor="middle" class="tiny" fill="#a33d32">新旧结构缝</text>

  <!-- side gate/opening projection -->
  <rect x="1230" y="840" width="20" height="55" fill="#fffdf8"/>
  <text x="1260" y="850" class="tiny" fill="#765d43">右侧门下方保持畅通</text>

  <!-- section notes C -->
  <rect x="1230" y="930" width="330" height="105" rx="5" fill="#fff4dc" stroke="#cba458" stroke-width="2"/>
  <text x="1250" y="958" class="small" fill="#624a1e">蓝色内部不留结构缝。</text>
  <text x="1250" y="982" class="small" fill="#624a1e">右翼荷载由新柱和新基础承担。</text>
  <text x="1250" y="1006" class="small" fill="#624a1e">蓝色与橙色只做柔性功能连接。</text>

  <!-- bottom notes -->
  <rect x="175" y="1110" width="1450" height="40" rx="4" fill="#fff4dc" stroke="#cba458" stroke-width="1"/>
  <text x="195" y="1135" class="small" fill="#624a1e">施工顺序：鉴定旧楼 → 建新外围暗管并试水 → 停用旧沟 → 分段拆除厨房和后排瓦房 → 分段开挖新基础 → 建蓝色连续U形。</text>

  <!-- global legend -->
  <rect x="45" y="1167" width="30" height="18" fill="#9dd7e8" stroke="#25748a" stroke-width="2"/>
  <text x="85" y="1182" class="tiny">蓝色：新建统一结构</text>
  <rect x="285" y="1167" width="30" height="18" fill="#ff8a34" stroke="#a84c16" stroke-width="2"/>
  <text x="325" y="1182" class="tiny">橙色：原二层保留</text>
  <rect x="525" y="1167" width="30" height="18" fill="url(#joint)" stroke="#c05c4d" stroke-width="1"/>
  <text x="565" y="1182" class="tiny">斜纹：新旧结构缝</text>
  <line x1="765" y1="1177" x2="815" y2="1177" stroke="#126f9f" stroke-width="8"/>
  <text x="825" y="1182" class="tiny">深蓝：新密闭排水管</text>
  <text x="1265" y="1182" class="tiny" fill="#a33330">概念方案，须经房屋鉴定、结构设计和当地审批后施工。</text>
</svg>
