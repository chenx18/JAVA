<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1220" viewBox="0 0 1720 1220">
  <defs>
    <marker id="flow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#126f9f"/>
    </marker>
    <marker id="circulate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#175c72"/>
    </marker>
    <pattern id="joint" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c05c4d" stroke-width="3"/>
    </pattern>
    <style>
      .title { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 31px; font-weight: 700; fill: #202326; }
      .sub { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 16px; fill: #5b6167; }
      .h2 { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 22px; font-weight: 700; fill: #202326; }
      .label { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 16px; fill: #2e3338; }
      .small { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 13px; fill: #555c62; }
      .tiny { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 11px; fill: #646b71; }
    </style>
  </defs>

  <rect width="1720" height="1220" fill="#f7f5f0"/>
  <text x="55" y="52" class="title">最终概念方案：保留原二层，蓝色连续倒U形，后楼设堂屋神台</text>
  <text x="55" y="82" class="sub">墙外排水管与后楼之间隔着后侧通道和你的围墙；新旧结构分开，使用功能连通</text>

  <!-- panel backgrounds -->
  <rect x="35" y="115" width="900" height="670" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <rect x="965" y="115" width="720" height="670" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="60" y="153" class="h2">A 改建后一层：堂屋、神台、中庭和交通</text>
  <text x="990" y="153" class="h2">B 改建后二层：蓝色连续倒U形</text>

  <!-- ================= FIRST FLOOR ================= -->
  <!-- neighbour -->
  <rect x="65" y="220" width="210" height="480" fill="#e8e8e8" stroke="#303337" stroke-width="4"/>
  <text x="170" y="445" text-anchor="middle" class="label">邻居房屋</text>
  <text x="170" y="471" text-anchor="middle" class="tiny">建筑贴近你的左侧围墙</text>

  <!-- L-shaped property -->
  <path d="M280 220 L755 220 L755 455 L905 455 L905 700 L280 700 Z" fill="#fffdf8" stroke="#a93632" stroke-width="5"/>
  <text x="295" y="242" class="tiny" fill="#a93632">你的围墙范围</text>

  <!-- outside pipe band and pipe -->
  <rect x="350" y="185" width="405" height="23" fill="#e7eef1"/>
  <rect x="760" y="220" width="35" height="245" fill="#e7eef1"/>
  <rect x="770" y="450" width="132" height="30" fill="#e7eef1"/>
  <path d="M275 405 L320 405 L320 245 L350 245 L350 197 L770 197 L780 220 L780 455 L902 465 L902 550" fill="none" stroke="#126f9f" stroke-width="12" marker-end="url(#flow)"/>
  <circle cx="320" cy="405" r="10" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="350" cy="197" r="10" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="780" cy="455" r="10" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <text x="550" y="180" text-anchor="middle" class="small" fill="#126f9f">围墙外密闭排水管</text>
  <text x="335" y="425" class="tiny" fill="#126f9f">邻居侧唯一内接段</text>
  <rect x="872" y="528" width="70" height="48" rx="3" fill="#ed3434" stroke="#9b1c1c" stroke-width="2"/>
  <text x="907" y="547" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" font-weight="700" fill="#fff">公共水道</text>
  <text x="907" y="564" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#fff">接入口</text>

  <!-- rear passage -->
  <rect x="360" y="240" width="365" height="34" fill="#edf4e9" stroke="#8da18a" stroke-width="2"/>
  <text x="542" y="263" text-anchor="middle" class="small" fill="#527054">后楼与围墙之间约0.8～1米通道</text>

  <!-- left wall passage -->
  <rect x="295" y="270" width="45" height="390" fill="#eaf4e5" stroke="#769b6e" stroke-width="2"/>
  <text x="317" y="460" text-anchor="middle" class="tiny" fill="#416b43" transform="rotate(-90 317 460)">左侧约1～1.2米围墙通道</text>

  <!-- continuous new L first floor -->
  <path d="M355 285 L730 285 L730 420 L450 420 L450 680 L355 680 Z" fill="#9dd7e8" stroke="#25748a" stroke-width="5"/>

  <!-- rear house partitions -->
  <line x1="480" y1="285" x2="480" y2="420" stroke="#25748a" stroke-width="3"/>
  <line x1="625" y1="285" x2="625" y2="420" stroke="#25748a" stroke-width="3"/>
  <text x="418" y="350" text-anchor="middle" class="small" fill="#18566a">后楼房间</text>
  <text x="552" y="345" text-anchor="middle" class="label" fill="#18566a">堂屋</text>
  <text x="552" y="370" text-anchor="middle" class="small" fill="#25748a">面向中庭</text>
  <text x="677" y="340" text-anchor="middle" class="small" fill="#18566a">房间 / 湿区</text>
  <text x="677" y="365" text-anchor="middle" class="tiny" fill="#18566a">卫生间设在端部</text>

  <!-- altar -->
  <rect x="515" y="294" width="75" height="28" rx="3" fill="#c89b3c" stroke="#775a1e" stroke-width="2"/>
  <text x="552" y="313" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#fff">神台</text>
  <line x1="552" y1="322" x2="552" y2="410" stroke="#775a1e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="560" y="400" class="tiny" fill="#775a1e">神台后为后楼实墙</text>

  <!-- hall opening toward courtyard -->
  <rect x="520" y="408" width="65" height="14" fill="#18566a"/>
  <text x="592" y="418" class="tiny" fill="#18566a">堂屋门</text>

  <!-- left wing kitchen and stairs -->
  <line x1="355" y1="520" x2="450" y2="520" stroke="#25748a" stroke-width="3"/>
  <text x="402" y="465" text-anchor="middle" class="small" fill="#18566a">新厨房</text>
  <text x="402" y="490" text-anchor="middle" class="tiny" fill="#18566a">饭厅 / 餐区</text>
  <text x="402" y="575" text-anchor="middle" class="small" fill="#18566a">独立楼梯</text>
  <text x="402" y="600" text-anchor="middle" class="tiny" fill="#18566a">通往蓝色二层U形</text>
  <text x="465" y="438" class="tiny" fill="#18566a">左后转角连续</text>

  <!-- courtyard -->
  <rect x="475" y="440" width="245" height="125" fill="#eaf4e5" stroke="#769b6e" stroke-width="3"/>
  <text x="597" y="486" text-anchor="middle" class="label" fill="#416b43">中庭 / 天井</text>
  <text x="597" y="511" text-anchor="middle" class="small" fill="#527054">净深约3～4米</text>
  <text x="597" y="536" text-anchor="middle" class="tiny" fill="#527054">露天；雨水单独排出</text>

  <!-- old building retained -->
  <rect x="475" y="585" width="300" height="95" fill="#ff8a34" stroke="#a84c16" stroke-width="4"/>
  <line x1="570" y1="585" x2="570" y2="680" stroke="#a84c16" stroke-width="2"/>
  <line x1="675" y1="585" x2="675" y2="680" stroke="#a84c16" stroke-width="2"/>
  <text x="625" y="625" text-anchor="middle" class="label" fill="#84370f">原二层楼：保留</text>
  <text x="625" y="650" text-anchor="middle" class="tiny" fill="#84370f">一层厅堂 / 房间；旧石基础待鉴定</text>

  <!-- structural joint -->
  <rect x="450" y="585" width="25" height="95" fill="url(#joint)" stroke="#c05c4d" stroke-width="1"/>
  <text x="462" y="699" text-anchor="middle" class="tiny" fill="#a33d32">新旧结构缝</text>

  <!-- retained storage -->
  <rect x="790" y="500" width="95" height="180" fill="#eadfcf" stroke="#735d43" stroke-width="3"/>
  <text x="837" y="565" text-anchor="middle" class="small" fill="#604d36">原一层</text>
  <text x="837" y="589" text-anchor="middle" class="small" fill="#604d36">杂物房</text>
  <text x="837" y="616" text-anchor="middle" class="tiny" fill="#604d36">保留</text>

  <!-- right gate and ground passage -->
  <rect x="745" y="345" width="22" height="90" fill="#fffdf8"/>
  <line x1="755" y1="353" x2="730" y2="390" stroke="#765d43" stroke-width="3"/>
  <line x1="755" y1="427" x2="730" y2="395" stroke="#765d43" stroke-width="3"/>
  <text x="775" y="345" class="small" fill="#765d43">右侧门保留</text>
  <rect x="735" y="440" width="35" height="125" fill="#f3f6f0" stroke="#a4b69e" stroke-width="2"/>
  <text x="752" y="505" text-anchor="middle" class="tiny" fill="#5c7659" transform="rotate(90 752 505)">一层通道</text>
  <circle cx="725" cy="440" r="8" fill="#25748a"/>
  <circle cx="725" cy="555" r="8" fill="#25748a"/>
  <line x1="725" y1="440" x2="725" y2="555" stroke="#25748a" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="713" y="498" text-anchor="middle" class="tiny" fill="#25748a" transform="rotate(-90 713 498)">短右翼新柱</text>

  <!-- ================= SECOND FLOOR ================= -->
  <path d="M1030 220 L1450 220 L1450 455 L1600 455 L1600 700 L1030 700 Z" fill="#fffdf8" stroke="#a93632" stroke-width="5"/>
  <text x="1045" y="242" class="tiny" fill="#a93632">二层投影 / 围墙范围</text>

  <!-- continuous blue U -->
  <path d="M1090 275 L1430 275 L1430 520 L1370 520 L1370 410 L1170 410 L1170 680 L1090 680 Z" fill="#9dd7e8" stroke="#25748a" stroke-width="5"/>
  <circle cx="1170" cy="410" r="15" fill="#25748a"/>
  <circle cx="1370" cy="410" r="15" fill="#25748a"/>
  <text x="1190" y="397" class="tiny" fill="#18566a">左后转角连续</text>
  <text x="1288" y="397" class="tiny" fill="#18566a">右后转角连续</text>

  <!-- rear floor partitions -->
  <line x1="1210" y1="275" x2="1210" y2="410" stroke="#25748a" stroke-width="3"/>
  <line x1="1340" y1="275" x2="1340" y2="410" stroke="#25748a" stroke-width="3"/>
  <text x="1150" y="337" text-anchor="middle" class="small" fill="#18566a">二层房间</text>
  <text x="1275" y="330" text-anchor="middle" class="label" fill="#18566a">家庭厅 / 房间</text>
  <text x="1275" y="355" text-anchor="middle" class="tiny" fill="#18566a">神台正上方不设卫生间</text>
  <text x="1385" y="323" text-anchor="middle" class="small" fill="#18566a">卫生间</text>
  <text x="1385" y="347" text-anchor="middle" class="tiny" fill="#18566a">与一层湿区对齐</text>

  <!-- left wing -->
  <text x="1130" y="520" text-anchor="middle" class="small" fill="#18566a" transform="rotate(-90 1130 520)">左翼：房间 / 楼梯厅</text>

  <!-- short right wing -->
  <text x="1400" y="470" text-anchor="middle" class="tiny" fill="#18566a" transform="rotate(90 1400 470)">短右翼：走廊/书房</text>
  <text x="1440" y="535" class="tiny" fill="#25748a">下方保持侧门通道</text>

  <!-- courtyard opening -->
  <rect x="1190" y="435" width="160" height="115" fill="#fff" stroke="#769b6e" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="1270" y="480" text-anchor="middle" class="label" fill="#416b43">中庭挑空口</text>
  <text x="1270" y="506" text-anchor="middle" class="tiny" fill="#527054">保持露天，不封顶</text>
  <text x="1270" y="529" text-anchor="middle" class="tiny" fill="#527054">前后二层采光通风</text>

  <!-- circulation -->
  <path d="M1130 640 L1130 330 L1398 330 L1398 475" fill="none" stroke="#175c72" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#circulate)"/>
  <text x="1265" y="320" text-anchor="middle" class="tiny" fill="#175c72">蓝色内部连续：左翼 → 后楼 → 短右翼</text>

  <!-- retained old second floor -->
  <rect x="1190" y="575" width="270" height="105" fill="#ff8a34" stroke="#a84c16" stroke-width="4"/>
  <text x="1325" y="618" text-anchor="middle" class="label" fill="#84370f">橙色原二层保留</text>
  <text x="1325" y="644" text-anchor="middle" class="tiny" fill="#84370f">不加荷载，不承托蓝色新楼</text>

  <!-- new-old joint and functional link -->
  <rect x="1170" y="575" width="20" height="105" fill="url(#joint)" stroke="#c05c4d" stroke-width="1"/>
  <line x1="1170" y1="610" x2="1190" y2="610" stroke="#765d43" stroke-width="5"/>
  <text x="1160" y="696" text-anchor="middle" class="tiny" fill="#a33d32">结构缝＋柔性门连接</text>

  <!-- notes second floor -->
  <rect x="1480" y="570" width="175" height="110" rx="5" fill="#fff4dc" stroke="#cba458" stroke-width="2"/>
  <text x="1495" y="598" class="tiny" fill="#624a1e">蓝色U形内部不留缝。</text>
  <text x="1495" y="622" class="tiny" fill="#624a1e">右翼由新柱基础承担。</text>
  <text x="1495" y="646" class="tiny" fill="#624a1e">蓝橙之间结构分开。</text>
  <text x="1495" y="670" class="tiny" fill="#624a1e">使用上可以开门连接。</text>

  <!-- ================= BOTTOM SECTION ================= -->
  <rect x="35" y="810" width="1650" height="320" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="60" y="848" class="h2">C 堂屋神台、后侧通道、围墙和墙外暗管剖面</text>

  <!-- outside ground and pipe -->
  <line x1="70" y1="1040" x2="980" y2="1040" stroke="#8a6b4a" stroke-width="4"/>
  <ellipse cx="130" cy="1010" rx="43" ry="24" fill="#126f9f" stroke="#0b4d6f" stroke-width="3"/>
  <text x="130" y="1068" text-anchor="middle" class="small" fill="#126f9f">围墙外暗管</text>

  <!-- boundary wall -->
  <rect x="230" y="895" width="55" height="145" fill="#c6c6c6" stroke="#555" stroke-width="3"/>
  <text x="258" y="1068" text-anchor="middle" class="small">你的后围墙</text>

  <!-- rear passage -->
  <rect x="285" y="985" width="210" height="55" fill="#edf4e9" stroke="#8da18a" stroke-width="2"/>
  <text x="390" y="1017" text-anchor="middle" class="small" fill="#527054">0.8～1米后侧通道</text>
  <line x1="300" y1="1032" x2="475" y2="1032" stroke="#527054" stroke-width="2" marker-end="url(#flow)"/>

  <!-- rear building and altar section -->
  <rect x="495" y="880" width="320" height="160" fill="#9dd7e8" stroke="#25748a" stroke-width="4"/>
  <rect x="520" y="940" width="55" height="50" fill="#c89b3c" stroke="#775a1e" stroke-width="3"/>
  <text x="547" y="970" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#fff">神台</text>
  <text x="655" y="930" text-anchor="middle" class="label" fill="#18566a">后楼堂屋</text>
  <text x="655" y="957" text-anchor="middle" class="small" fill="#25748a">神台背后是后楼实墙</text>
  <text x="655" y="983" text-anchor="middle" class="tiny" fill="#25748a">无卫生间、无排污管、无结构缝</text>
  <text x="655" y="1010" text-anchor="middle" class="tiny" fill="#25748a">面向中庭和前楼方向</text>

  <!-- courtyard and old building section -->
  <rect x="815" y="985" width="190" height="55" fill="#eaf4e5" stroke="#769b6e" stroke-width="2"/>
  <text x="910" y="1017" text-anchor="middle" class="small" fill="#416b43">中庭 / 天井</text>
  <rect x="1005" y="920" width="160" height="120" fill="#ff8a34" stroke="#a84c16" stroke-width="4"/>
  <text x="1085" y="978" text-anchor="middle" class="small" fill="#84370f">原二层楼</text>
  <text x="1085" y="1003" text-anchor="middle" class="tiny" fill="#84370f">独立旧结构</text>

  <!-- relationship labels -->
  <line x1="130" y1="875" x2="547" y2="875" stroke="#6b747a" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="338" y="866" text-anchor="middle" class="tiny">墙外暗管与神台之间隔着围墙、通道和后楼实墙</text>

  <!-- bottom notes -->
  <rect x="1210" y="865" width="440" height="210" rx="5" fill="#fff4dc" stroke="#cba458" stroke-width="2"/>
  <text x="1230" y="895" class="label" fill="#624a1e">落实条件</text>
  <text x="1230" y="925" class="small" fill="#624a1e">1. 神台放堂屋后墙中部，面向中庭。</text>
  <text x="1230" y="951" class="small" fill="#624a1e">2. 围墙外检查井尽量与神台中心错开。</text>
  <text x="1230" y="977" class="small" fill="#624a1e">3. 神台正上方、背墙内不设卫生间和排污管。</text>
  <text x="1230" y="1003" class="small" fill="#624a1e">4. 后侧通道保持干燥、通风、可检修。</text>
  <text x="1230" y="1029" class="small" fill="#624a1e">5. 新管试通后再停旧沟并施工蓝色新基础。</text>
  <text x="1230" y="1055" class="small" fill="#624a1e">6. 旧楼须先鉴定石基础和地面下沉原因。</text>

  <!-- legend -->
  <rect x="65" y="1155" width="32" height="20" fill="#9dd7e8" stroke="#25748a" stroke-width="2"/>
  <text x="108" y="1171" class="tiny">蓝色：新建统一结构</text>
  <rect x="320" y="1155" width="32" height="20" fill="#ff8a34" stroke="#a84c16" stroke-width="2"/>
  <text x="363" y="1171" class="tiny">橙色：原二层保留</text>
  <rect x="575" y="1155" width="32" height="20" fill="url(#joint)" stroke="#c05c4d" stroke-width="1"/>
  <text x="618" y="1171" class="tiny">斜纹：新旧结构缝</text>
  <line x1="820" y1="1165" x2="870" y2="1165" stroke="#126f9f" stroke-width="8"/>
  <text x="880" y="1171" class="tiny">深蓝：围墙外密闭排水管</text>
  <text x="1280" y="1171" class="tiny" fill="#a33330">概念方案，须经房屋鉴定、结构设计和当地审批后施工。</text>
</svg>
