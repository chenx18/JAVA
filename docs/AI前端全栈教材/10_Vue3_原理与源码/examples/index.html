<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Vue - 响应式与节点复用</title>
<style>
  body { max-width: 46rem; margin: 3rem auto; padding: 0 1rem; font: 18px/1.6 Georgia, serif; color: #183a39; background: #f4f1e9; }
  button { margin: .25rem; padding: .5rem 1rem; font: inherit; cursor: pointer; }
  li { padding: .5rem; border-bottom: 1px solid #abbdb3; }
  input { max-width: 12rem; font: inherit; padding: .3rem; }
</style>
<h1>响应式与节点复用</h1>
<p>修改计数观察派生值；在列表输入框写入内容，再反转列表，检查输入是否跟随同一个项目。</p>
<div id="app"></div>
<button id="dispose" type="button">卸载示例</button>
<script type="module">
  import { createApp, reactive, computed, h } from './mini-vue.mjs';
  const records = [{ id: 'a', name: '甲' }, { id: 'b', name: '乙' }, { id: 'c', name: '丙' }];
  const app = createApp(() => {
    const state = reactive({ count: 0, reversed: false });
    const double = computed(() => state.count * 2);
    return () => h('section', {}, [
      h('p', {}, '计数 ' + state.count + '；两倍 ' + double.value),
      h('button', { type: 'button', onClick: () => state.count++ }, '增加'),
      h('button', { type: 'button', onClick: () => { state.reversed = !state.reversed; } }, '反转列表'),
      h('ul', {}, (state.reversed ? [...records].reverse() : records).map(item =>
        h('li', { key: item.id }, [h('label', {}, [item.name + ' ', h('input', { 'aria-label': item.name })])])
      ))
    ]);
  });
  app.mount(document.querySelector('#app'));
  document.querySelector('#dispose').addEventListener('click', () => app.unmount(), { once: true });
</script>
</html>
