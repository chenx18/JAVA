<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
  <defs>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#1879ad"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#3f7d4b"/>
    </marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#a65d2a"/>
    </marker>
    <marker id="arrowDark" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#333"/>
    </marker>
    <style>
      .title { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 30px; font-weight: 700; fill: #202326; }
      .subtitle { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 16px; fill: #5c6268; }
      .panel-title { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 23px; font-weight: 700; fill: #202326; }
      .label { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 16px; fill: #30343a; }
      .small { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 13px; fill: #53585e; }
      .tiny { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 12px; fill: #666b70; }
    </style>
  </defs>

  <rect width="1500" height="940" fill="#f6f4ef"/>
  <text x="55" y="52" class="title">现状布局与后院建主楼的排水建议图</text>
  <text x="55" y="82" class="subtitle">根据你提供的示意：左侧邻居排水进入，水沟由左向右排出；右图为概念性重建方案</text>

  <!-- orientation -->
  <circle cx="1375" cy="75" r="27" fill="#fff5d6" stroke="#d89b28" stroke-width="3"/>
  <g stroke="#d89b28" stroke-width="3">
    <line x1="1375" y1="37" x2="1375" y2="22"/><line x1="1375" y1="113" x2="1375" y2="128"/>
    <line x1="1337" y1="75" x2="1322" y2="75"/><line x1="1413" y1="75" x2="1428" y2="75"/>
  </g>
  <text x="1315" y="158" class="small">东：太阳升起（示意）</text>

  <!-- panel backgrounds -->
  <rect x="35" y="125" width="690" height="705" rx="8" fill="#ffffff" stroke="#d3d5d8" stroke-width="2"/>
  <rect x="775" y="125" width="690" height="705" rx="8" fill="#ffffff" stroke="#d3d5d8" stroke-width="2"/>
  <text x="60" y="165" class="panel-title">A 现状布局</text>
  <text x="800" y="165" class="panel-title">B 后院重建主楼：推荐布局</text>

  <!-- ================= CURRENT PANEL ================= -->
  <!-- neighbor -->
  <rect x="65" y="205" width="135" height="515" fill="#ececec" stroke="#333" stroke-width="4"/>
  <text x="132" y="465" text-anchor="middle" class="label">邻居</text>
  <text x="132" y="489" text-anchor="middle" class="tiny">生活水、雨水</text>
  <text x="132" y="507" text-anchor="middle" class="tiny">从此侧排来</text>

  <!-- current property boundary -->
  <rect x="205" y="205" width="485" height="515" fill="#fffdf8" stroke="#ad3934" stroke-width="4"/>
  <text x="220" y="230" class="tiny" fill="#ad3934">你的围墙范围</text>

  <!-- rear courtyard -->
  <rect x="215" y="220" width="465" height="145" fill="#edf4e9"/>
  <text x="445" y="350" text-anchor="middle" class="small">后院</text>
  <!-- rear tiled house -->
  <rect x="365" y="235" width="250" height="63" fill="#d8c197" stroke="#735b35" stroke-width="3"/>
  <line x1="425" y1="235" x2="425" y2="298" stroke="#735b35" stroke-width="2"/>
  <line x1="500" y1="235" x2="500" y2="298" stroke="#735b35" stroke-width="2"/>
  <text x="490" y="274" text-anchor="middle" class="label">后排瓦房</text>

  <!-- current mixed ditch -->
  <rect x="202" y="366" width="490" height="29" fill="#63bce6"/>
  <line x1="228" y1="380" x2="648" y2="380" stroke="#1879ad" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="445" y="360" text-anchor="middle" class="label" fill="#12658f">现状混合水沟：生活水 + 雨水</text>
  <text x="445" y="416" text-anchor="middle" class="small" fill="#12658f">水流方向：左 → 右</text>
  <text x="445" y="434" text-anchor="middle" class="tiny" fill="#a3322e">与前面房屋后墙距离不到一米，需防潮、防冲刷</text>

  <!-- current front building -->
  <rect x="215" y="448" width="465" height="262" fill="#f0d5c9" stroke="#8c3b32" stroke-width="4"/>
  <line x1="300" y1="448" x2="300" y2="710" stroke="#8c3b32" stroke-width="3"/>
  <line x1="420" y1="448" x2="420" y2="710" stroke="#8c3b32" stroke-width="3"/>
  <line x1="565" y1="448" x2="565" y2="710" stroke="#8c3b32" stroke-width="3"/>
  <line x1="625" y1="448" x2="625" y2="710" stroke="#8c3b32" stroke-width="3"/>
  <text x="257" y="535" text-anchor="middle" class="label">厨房</text>
  <text x="360" y="535" text-anchor="middle" class="label">房间</text>
  <text x="492" y="535" text-anchor="middle" class="label">一楼厅堂</text>
  <text x="595" y="535" text-anchor="middle" class="label">房间</text>
  <text x="652" y="535" text-anchor="middle" class="label">房间</text>
  <text x="447" y="683" text-anchor="middle" class="small">现有前面小楼 / 一层房屋</text>
  <rect x="425" y="694" width="48" height="16" fill="#8c3b32"/>
  <text x="482" y="708" class="tiny">大门（位置示意）</text>

  <!-- current warning -->
  <rect x="55" y="750" width="650" height="55" rx="4" fill="#fff0e9" stroke="#c66b4f" stroke-width="2"/>
  <text x="70" y="773" class="small" fill="#8b3b2c">现状问题：混合排水沟横穿院落，贴近房屋后墙，</text>
  <text x="70" y="792" class="small" fill="#8b3b2c">生活污水、雨水混流，存在返潮、臭味、倒灌和冲刷风险。</text>

  <!-- ================= PROPOSED PANEL ================= -->
  <!-- neighbor -->
  <rect x="805" y="205" width="105" height="515" fill="#ececec" stroke="#333" stroke-width="4"/>
  <text x="857" y="465" text-anchor="middle" class="label">邻居</text>
  <text x="857" y="489" text-anchor="middle" class="tiny">排水来向</text>

  <!-- proposed property boundary -->
  <rect x="915" y="205" width="515" height="515" fill="#fffdf8" stroke="#ad3934" stroke-width="4"/>
  <text x="930" y="230" class="tiny" fill="#ad3934">你的围墙范围</text>

  <!-- rear drainage corridor -->
  <rect x="925" y="220" width="495" height="43" fill="#e9f1e8" stroke="#6e8d6d" stroke-width="2"/>
  <text x="1170" y="245" text-anchor="middle" class="small" fill="#47704d">后侧排水带：不进入主楼基础范围</text>

  <!-- proposed main house replacing rear tile house -->
  <rect x="1000" y="285" width="350" height="175" fill="#c8dce9" stroke="#315d7a" stroke-width="4"/>
  <text x="1175" y="362" text-anchor="middle" class="label" fill="#23435a">拟建主楼</text>
  <text x="1175" y="389" text-anchor="middle" class="small" fill="#315d7a">后院位置（原瓦房区域）</text>
  <text x="1175" y="415" text-anchor="middle" class="tiny" fill="#315d7a">基础下不走排水管、不设检查井</text>
  <rect x="1152" y="444" width="48" height="16" fill="#315d7a"/>
  <text x="1210" y="458" class="tiny" fill="#315d7a">主入口</text>

  <!-- old ditch removed -->
  <line x1="918" y1="495" x2="1427" y2="495" stroke="#929292" stroke-width="12" stroke-dasharray="20 12" opacity="0.75"/>
  <line x1="918" y1="495" x2="1427" y2="495" stroke="#ad3934" stroke-width="3"/>
  <text x="1170" y="485" text-anchor="middle" class="small" fill="#a3322e">原横向明沟：改造后不再贴主楼前方</text>

  <!-- existing front building remains -->
  <rect x="925" y="530" width="495" height="180" fill="#f0d5c9" stroke="#8c3b32" stroke-width="4"/>
  <line x1="1010" y1="530" x2="1010" y2="710" stroke="#8c3b32" stroke-width="3"/>
  <line x1="1120" y1="530" x2="1120" y2="710" stroke="#8c3b32" stroke-width="3"/>
  <line x1="1265" y1="530" x2="1265" y2="710" stroke="#8c3b32" stroke-width="3"/>
  <line x1="1330" y1="530" x2="1330" y2="710" stroke="#8c3b32" stroke-width="3"/>
  <text x="967" y="610" text-anchor="middle" class="small">厨房</text>
  <text x="1065" y="610" text-anchor="middle" class="small">房间</text>
  <text x="1190" y="610" text-anchor="middle" class="small">一楼厅堂</text>
  <text x="1297" y="610" text-anchor="middle" class="small">房间</text>
  <text x="1375" y="610" text-anchor="middle" class="small">房间</text>
  <text x="1170" y="690" text-anchor="middle" class="tiny">原有前面小楼（可按实际需要保留或改造）</text>

  <!-- proposed U route: sewage and rain separated -->
  <path d="M918 495 L940 495 L940 241 L1395 241 L1395 495 L1425 495" fill="none" stroke="#a65d2a" stroke-width="9" marker-end="url(#arrowOrange)"/>
  <path d="M918 505 L952 505 L952 252 L1383 252 L1383 505 L1425 505" fill="none" stroke="#3f7d4b" stroke-width="7" stroke-dasharray="17 10" marker-end="url(#arrowGreen)"/>
  <circle cx="940" cy="495" r="11" fill="#fff" stroke="#a65d2a" stroke-width="3"/>
  <circle cx="1395" cy="495" r="11" fill="#fff" stroke="#a65d2a" stroke-width="3"/>
  <circle cx="952" cy="505" r="10" fill="#fff" stroke="#3f7d4b" stroke-width="3"/>
  <circle cx="1383" cy="505" r="10" fill="#fff" stroke="#3f7d4b" stroke-width="3"/>
  <text x="970" y="277" class="tiny" fill="#8b4b25">棕线：生活污水（接化粪池/正规污水管）</text>
  <text x="970" y="296" class="tiny" fill="#3f7d4b">绿虚线：雨水（单独排放）</text>
  <text x="1240" y="525" class="tiny" fill="#333">右侧合规出口 →</text>

  <!-- proposed entrance note -->
  <rect x="940" y="750" width="550" height="55" rx="4" fill="#edf6ed" stroke="#6e9a71" stroke-width="2"/>
  <text x="955" y="773" class="small" fill="#3d6842">推荐：主楼不压沟、不贴沟；主门避开排水出口，</text>
  <text x="955" y="792" class="small" fill="#3d6842">污水雨水分流，管线设检查井，暴雨时不得倒灌。</text>

  <!-- legend -->
  <rect x="55" y="855" width="1390" height="55" rx="5" fill="#fff9e8" stroke="#c8a35b" stroke-width="2"/>
  <text x="75" y="888" class="small" fill="#59471f">说明：本图用于沟通布局，不是建筑结构图或排水施工图。正式施工前须复核地势高差、雨季最大流量、基础安全距离、管径坡度、检修井和当地审批要求。</text>
</svg>
