<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1150" viewBox="0 0 1650 1150">
  <defs>
    <marker id="flow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#126f9f"/>
    </marker>
    <marker id="stepArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#5a6167"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,5 L10,0 L10,10 Z" fill="#8b6c3e"/>
    </marker>
    <pattern id="joint" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c05c4d" stroke-width="3"/>
    </pattern>
    <style>
      .title { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 31px; font-weight: 700; fill: #202326; }
      .sub { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 16px; fill: #5b6167; }
      .h2 { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 22px; font-weight: 700; fill: #202326; }
      .label { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 17px; fill: #2e3338; }
      .small { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 14px; fill: #555c62; }
      .tiny { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 12px; fill: #646b71; }
    </style>
  </defs>

  <rect width="1650" height="1150" fill="#f7f5f0"/>
  <text x="55" y="52" class="title">最低拆改版：保留原二层，厨房和后院重建独立二层</text>
  <text x="55" y="82" class="sub">左侧留围墙通道，中间留小天井；新旧结构分开；先建新排水暗管并试水，再停用原水沟</text>

  <!-- plan frame -->
  <rect x="45" y="120" width="1560" height="700" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="70" y="158" class="h2">推荐平面布局（俯视概念图，不按实际比例）</text>

  <!-- neighbour -->
  <rect x="90" y="215" width="245" height="520" fill="#e8e8e8" stroke="#303337" stroke-width="4"/>
  <text x="212" y="450" text-anchor="middle" class="label">邻居房屋</text>
  <text x="212" y="477" text-anchor="middle" class="small">原来与厨房贴建</text>
  <text x="212" y="503" text-anchor="middle" class="tiny">生活水、雨水从此侧来</text>

  <!-- L-shaped property boundary -->
  <path d="M340 215 L1120 215 L1120 495 L1425 495 L1425 735 L340 735 Z" fill="#fffdf8" stroke="#a93632" stroke-width="6"/>
  <text x="360" y="241" class="tiny" fill="#a93632">你的围墙保留；所有新建部分使用独立基础</text>
  <text x="1150" y="521" class="tiny" fill="#a93632">前面右侧外扩区</text>

  <!-- rear service passage -->
  <rect x="450" y="245" width="600" height="32" fill="#edf4e9" stroke="#8da18a" stroke-width="2"/>
  <text x="750" y="266" text-anchor="middle" class="tiny" fill="#527054">后侧约0.8～1米检修、防水、通风带</text>

  <!-- new rear two-story house -->
  <rect x="515" y="285" width="535" height="135" fill="#9dd7e8" stroke="#25748a" stroke-width="5"/>
  <text x="782" y="344" text-anchor="middle" class="label" fill="#18566a">新建二层后楼 / 主屋</text>
  <text x="782" y="370" text-anchor="middle" class="small" fill="#25748a">建议进深约3.5～4米</text>
  <text x="782" y="394" text-anchor="middle" class="tiny" fill="#25748a">独立新基础，不压暗管、不依赖旧楼</text>
  <rect x="950" y="300" width="82" height="82" fill="#d7ecf3" stroke="#25748a" stroke-width="3"/>
  <text x="991" y="328" text-anchor="middle" class="tiny" fill="#18566a">卫生间/</text>
  <text x="991" y="346" text-anchor="middle" class="tiny" fill="#18566a">上下湿区</text>
  <text x="991" y="365" text-anchor="middle" class="tiny" fill="#18566a">独立管井</text>

  <!-- left wall passage -->
  <rect x="360" y="280" width="72" height="310" fill="#eaf4e5" stroke="#769b6e" stroke-width="3"/>
  <text x="396" y="415" text-anchor="middle" class="small" fill="#416b43" transform="rotate(-90 396 415)">约1～1.2米围墙通道</text>
  <text x="413" y="430" text-anchor="middle" class="tiny" fill="#527054" transform="rotate(-90 413 430)">排水检修、通风、人行</text>

  <!-- rebuilt kitchen wing: includes the original front kitchen footprint -->
  <rect x="450" y="430" width="105" height="275" fill="#9dd7e8" stroke="#25748a" stroke-width="4"/>
  <line x1="450" y1="590" x2="555" y2="590" stroke="#25748a" stroke-width="3"/>
  <text x="503" y="472" text-anchor="middle" class="small" fill="#18566a">原厨房全部拆除</text>
  <text x="503" y="497" text-anchor="middle" class="small" fill="#18566a">重建独立二层</text>
  <text x="503" y="524" text-anchor="middle" class="tiny" fill="#18566a">1F厨房 / 餐区</text>
  <text x="503" y="545" text-anchor="middle" class="tiny" fill="#18566a">2F房间</text>
  <text x="503" y="625" text-anchor="middle" class="small" fill="#18566a">新楼独立楼梯</text>
  <text x="503" y="650" text-anchor="middle" class="tiny" fill="#18566a">占原厨房前段</text>
  <text x="503" y="671" text-anchor="middle" class="tiny" fill="#18566a">楼梯下可储物</text>

  <!-- compact courtyard -->
  <rect x="575" y="445" width="475" height="125" fill="#eaf4e5" stroke="#769b6e" stroke-width="3"/>
  <text x="812" y="494" text-anchor="middle" class="label" fill="#416b43">小天井 / 中庭</text>
  <text x="812" y="520" text-anchor="middle" class="small" fill="#527054">建议净深约2.7～3米</text>
  <text x="812" y="545" text-anchor="middle" class="tiny" fill="#527054">保持开敞，不设污水井、明沟</text>

  <!-- rear depth dimension -->
  <line x1="440" y1="235" x2="440" y2="600" stroke="#8b6c3e" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="423" y="425" text-anchor="middle" class="small" fill="#8b6c3e" transform="rotate(-90 423 425)">后院总纵深约7～8米</text>

  <!-- retained old two-story building -->
  <rect x="575" y="600" width="535" height="105" fill="#ff8a34" stroke="#a84c16" stroke-width="5"/>
  <line x1="700" y1="600" x2="700" y2="705" stroke="#a84c16" stroke-width="3"/>
  <line x1="865" y1="600" x2="865" y2="705" stroke="#a84c16" stroke-width="3"/>
  <line x1="980" y1="600" x2="980" y2="705" stroke="#a84c16" stroke-width="3"/>
  <text x="842" y="643" text-anchor="middle" class="label" fill="#84370f">原二层楼：保留</text>
  <text x="842" y="670" text-anchor="middle" class="small" fill="#84370f">先鉴定地面下沉和石基础</text>
  <rect x="795" y="686" width="70" height="19" fill="#84370f"/>
  <text x="875" y="701" class="tiny" fill="#84370f">原主门</text>

  <!-- structural joint between rebuilt kitchen wing and retained old building -->
  <rect x="555" y="600" width="20" height="105" fill="url(#joint)" stroke="#c05c4d" stroke-width="1"/>
  <text x="585" y="718" class="tiny" fill="#a33d32">新旧结构缝：使用上可连通，结构上不得硬接</text>

  <!-- retained right one-story storage -->
  <rect x="1125" y="530" width="275" height="175" fill="#eadfcf" stroke="#735d43" stroke-width="4"/>
  <text x="1262" y="606" text-anchor="middle" class="label" fill="#604d36">原一层杂物房</text>
  <text x="1262" y="632" text-anchor="middle" class="small" fill="#604d36">保留 / 后期再改</text>
  <text x="1262" y="657" text-anchor="middle" class="tiny" fill="#604d36">可作为右厢房或储物</text>

  <!-- side gate -->
  <rect x="1108" y="355" width="25" height="95" fill="#fffdf8"/>
  <line x1="1118" y1="363" x2="1085" y2="400" stroke="#765d43" stroke-width="4"/>
  <line x1="1118" y1="442" x2="1085" y2="405" stroke="#765d43" stroke-width="4"/>
  <text x="1190" y="345" class="small" fill="#765d43">右侧门保留</text>
  <text x="1190" y="367" class="tiny" fill="#765d43">侧门 / 检修门</text>

  <!-- existing ditch retained only during works -->
  <line x1="335" y1="580" x2="1420" y2="580" stroke="#58b9dc" stroke-width="13" stroke-dasharray="22 13" opacity="0.75"/>
  <text x="850" y="592" text-anchor="middle" class="tiny" fill="#126f9f">原水沟位置：先完成新管切换，蓝色新楼才能在此施工</text>
  <line x1="570" y1="568" x2="592" y2="592" stroke="#b13b36" stroke-width="4"/>
  <line x1="592" y1="568" x2="570" y2="592" stroke="#b13b36" stroke-width="4"/>
  <line x1="1030" y1="568" x2="1052" y2="592" stroke="#b13b36" stroke-width="4"/>
  <line x1="1052" y1="568" x2="1030" y2="592" stroke="#b13b36" stroke-width="4"/>

  <!-- new sealed drain: inside only at neighbour side, outside elsewhere -->
  <path d="M335 400 L396 400 L396 250 L430 250 L430 210" fill="none" stroke="#126f9f" stroke-width="15"/>
  <path d="M430 210 L1128 210 L1145 230 L1145 490 L1438 510 L1438 585" fill="none" stroke="#126f9f" stroke-width="15" marker-end="url(#flow)"/>
  <rect x="415" y="180" width="705" height="22" fill="#e7eef1"/>
  <rect x="1125" y="215" width="38" height="285" fill="#e7eef1"/>
  <rect x="1135" y="495" width="300" height="31" fill="#e7eef1"/>
  <rect x="1425" y="500" width="35" height="105" fill="#e7eef1"/>
  <text x="760" y="176" text-anchor="middle" class="small" fill="#126f9f">新密闭暗管：邻居侧内接，穿墙后沿后侧和右侧外绕</text>
  <circle cx="396" cy="400" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="430" cy="210" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="1145" cy="490" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <text x="411" y="427" class="tiny" fill="#126f9f">进水检查井</text>
  <text x="442" y="202" class="tiny" fill="#126f9f">单点穿墙</text>
  <text x="1160" y="487" class="tiny" fill="#126f9f">转弯井</text>

  <!-- public drain connection -->
  <rect x="1400" y="558" width="110" height="58" rx="4" fill="#ed3434" stroke="#9b1c1c" stroke-width="3"/>
  <text x="1455" y="582" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" fill="#fff">红色位置</text>
  <text x="1455" y="603" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#fff">接公共水道</text>

  <!-- plan note -->
  <rect x="70" y="752" width="1505" height="48" fill="#fff4dc" stroke="#cba458" stroke-width="1"/>
  <text x="85" y="780" class="small" fill="#624a1e">关键：原厨房前后范围全部并入蓝色新建二层；新楼重做基础，橙色旧楼不加荷载；先改水沟，再施工新厨房翼房。</text>

  <!-- construction sequence panel -->
  <rect x="45" y="840" width="1560" height="235" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="70" y="878" class="h2">排水改线施工顺序：减少邻里争议，不中断排水</text>

  <rect x="75" y="915" width="270" height="105" rx="5" fill="#edf3f6" stroke="#7d9aaa" stroke-width="2"/>
  <circle cx="105" cy="944" r="17" fill="#126f9f"/>
  <text x="105" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">1</text>
  <text x="135" y="948" class="label">旧沟继续通水</text>
  <text x="95" y="978" class="small">测量流量、坡度和公共接口</text>
  <text x="95" y="1002" class="tiny">拍照记录，书面通知并留临时导流</text>

  <line x1="355" y1="968" x2="405" y2="968" stroke="#5a6167" stroke-width="4" marker-end="url(#stepArrow)"/>

  <rect x="415" y="915" width="300" height="105" rx="5" fill="#edf3f6" stroke="#7d9aaa" stroke-width="2"/>
  <circle cx="445" cy="944" r="17" fill="#126f9f"/>
  <text x="445" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">2</text>
  <text x="475" y="948" class="label">先建新暗管</text>
  <text x="435" y="978" class="small">工程全部在合法范围内完成</text>
  <text x="435" y="1002" class="tiny">不堵旧沟，不扰动邻居基础</text>

  <line x1="725" y1="968" x2="775" y2="968" stroke="#5a6167" stroke-width="4" marker-end="url(#stepArrow)"/>

  <rect x="785" y="915" width="330" height="105" rx="5" fill="#edf3f6" stroke="#7d9aaa" stroke-width="2"/>
  <circle cx="815" cy="944" r="17" fill="#126f9f"/>
  <text x="815" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">3</text>
  <text x="845" y="948" class="label">接公共水道并试水</text>
  <text x="805" y="978" class="small">暴雨量、倒灌和检查井同时验证</text>
  <text x="805" y="1002" class="tiny">取得必要接入许可和现场记录</text>

  <line x1="1125" y1="968" x2="1175" y2="968" stroke="#5a6167" stroke-width="4" marker-end="url(#stepArrow)"/>

  <rect x="1185" y="915" width="360" height="105" rx="5" fill="#edf3f6" stroke="#7d9aaa" stroke-width="2"/>
  <circle cx="1215" cy="944" r="17" fill="#126f9f"/>
  <text x="1215" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">4</text>
  <text x="1245" y="948" class="label">切换后停用旧沟</text>
  <text x="1205" y="978" class="small">确认排水正常后再封闭或回填</text>
  <text x="1205" y="1002" class="tiny">避免先堵后建造成倒灌和责任争议</text>

  <text x="75" y="1050" class="tiny" fill="#a33330">若邻居现场阻拦：暂停冲突位置，固定证据，联系村委/乡镇及属地住建、水务协调；不要自行断水或发生正面冲突。</text>

  <!-- legend -->
  <line x1="70" y1="1100" x2="120" y2="1100" stroke="#126f9f" stroke-width="9"/>
  <text x="130" y="1105" class="tiny">深蓝：新密闭暗管</text>
  <line x1="330" y1="1100" x2="380" y2="1100" stroke="#58b9dc" stroke-width="9" stroke-dasharray="18 9"/>
  <text x="390" y="1105" class="tiny">浅蓝虚线：原沟/临时导流</text>
  <rect x="650" y="1088" width="34" height="22" fill="#9dd7e8" stroke="#25748a" stroke-width="2"/>
  <text x="695" y="1105" class="tiny">蓝色建筑：新建独立二层</text>
  <rect x="960" y="1088" width="34" height="22" fill="#ff8a34" stroke="#a84c16" stroke-width="2"/>
  <text x="1005" y="1105" class="tiny">橙色建筑：原二层保留</text>
  <text x="1275" y="1105" class="tiny" fill="#a33330">概念方案，须经房屋鉴定、结构设计和当地审批。</text>
</svg>
