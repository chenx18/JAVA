<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#f7f5ef"/>
  <text x="60" y="52" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#222">后院建主楼：推荐排水布置（概念示意）</text>
  <text x="60" y="82" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#666">主楼不压沟、不贴基础；生活污水与雨水分流，沿地块侧边排出</text>

  <!-- property boundary -->
  <rect x="80" y="125" width="1000" height="585" rx="4" fill="#fffdf8" stroke="#b83b35" stroke-width="5"/>
  <text x="95" y="153" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#b83b35">你的地块（围墙范围）</text>

  <!-- front / entrance -->
  <rect x="130" y="178" width="700" height="38" fill="#dedbd1"/>
  <text x="450" y="203" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#555">前方 / 主入口方向</text>

  <!-- existing front building -->
  <rect x="250" y="245" width="440" height="105" fill="#e7b6a7" stroke="#8c3b32" stroke-width="4"/>
  <text x="470" y="305" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#5c2723">原有小楼</text>
  <text x="470" y="332" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#6c403b">后墙与原水沟很近，应做防水和基础保护</text>

  <!-- old ditch, shown as crossed out -->
  <line x1="135" y1="390" x2="875" y2="390" stroke="#777" stroke-width="18" stroke-dasharray="24 12" opacity="0.8"/>
  <line x1="135" y1="390" x2="875" y2="390" stroke="#b83b35" stroke-width="4"/>
  <text x="505" y="378" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#a52b2b">原横向混合明沟：不建议继续贴近主楼</text>
  <text x="505" y="421" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#777">如必须保留，应改为有检修口的规范涵管，并确认不穿过基础</text>

  <!-- proposed main house -->
  <rect x="220" y="455" width="570" height="145" fill="#c9d9e9" stroke="#315d7a" stroke-width="5"/>
  <text x="505" y="525" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#23435a">拟建主楼</text>
  <text x="505" y="555" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#315d7a">主楼基础范围内不设排水管、检查井和化粪池</text>
  <rect x="475" y="583" width="60" height="17" fill="#315d7a"/>
  <text x="550" y="598" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#315d7a">主入口（示意）</text>

  <!-- rear tile house -->
  <rect x="275" y="635" width="460" height="52" fill="#d7c39e" stroke="#735b35" stroke-width="4"/>
  <text x="505" y="668" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#604b2b">后排一层瓦房</text>

  <!-- side drainage corridor -->
  <rect x="895" y="178" width="135" height="509" fill="#edf1e9" stroke="#6b7f62" stroke-width="2"/>
  <text x="963" y="235" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#4d6549">侧边排水带</text>
  <text x="963" y="263" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#4d6549">不经过房屋基础</text>

  <!-- sewage pipe -->
  <line x1="925" y1="315" x2="925" y2="655" stroke="#8c5a3c" stroke-width="13"/>
  <circle cx="925" cy="350" r="15" fill="#fff" stroke="#8c5a3c" stroke-width="4"/>
  <circle cx="925" cy="515" r="15" fill="#fff" stroke="#8c5a3c" stroke-width="4"/>
  <text x="945" y="440" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#8c5a3c">生活污水管</text>
  <text x="945" y="462" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#8c5a3c">接化粪池/正规污水管</text>

  <!-- rainwater pipe -->
  <line x1="990" y1="315" x2="990" y2="655" stroke="#3e88b5" stroke-width="11" stroke-dasharray="18 10"/>
  <circle cx="990" cy="350" r="14" fill="#fff" stroke="#3e88b5" stroke-width="4"/>
  <circle cx="990" cy="515" r="14" fill="#fff" stroke="#3e88b5" stroke-width="4"/>
  <text x="1008" y="400" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#2d6e96">雨水管</text>
  <text x="1008" y="422" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#2d6e96">单独排出</text>

  <!-- outlet arrow -->
  <line x1="925" y1="655" x2="925" y2="695" stroke="#333" stroke-width="4"/>
  <polygon points="925,710 914,690 936,690" fill="#333"/>
  <line x1="990" y1="655" x2="990" y2="695" stroke="#333" stroke-width="4"/>
  <polygon points="990,710 979,690 1001,690" fill="#333"/>
  <text x="1015" y="705" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#333">合规外排出口</text>

  <!-- callout -->
  <rect x="95" y="735" width="1010" height="55" rx="4" fill="#fff2d9" stroke="#c6913b" stroke-width="2"/>
  <text x="110" y="768" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#6c4b1d">施工前必须复核：地势高差、暴雨最大水量、管线检修空间、主楼基础安全距离和当地排水审批要求。</text>
</svg>
