<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <marker id="flow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#126f9f"/>
    </marker>
    <marker id="brownFlow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#9a572c"/>
    </marker>
    <marker id="greenFlow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3c7b4c"/>
    </marker>
    <style>
      .title { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 31px; font-weight: 700; fill: #202326; }
      .sub { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 16px; fill: #5b6167; }
      .h2 { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 22px; font-weight: 700; fill: #202326; }
      .label { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 17px; fill: #2e3338; }
      .small { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 14px; fill: #555c62; }
      .tiny { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 12px; fill: #646b71; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#f7f5f0"/>
  <text x="55" y="52" class="title">整屋重建最终概念布局：保留四面围墙，暗管绕行</text>
  <text x="55" y="82" class="sub">按你提供的现状：邻居在左侧贴墙建房，混合排水由左向右；右侧后院门保留，但不作为排水出口</text>

  <!-- sun / orientation -->
  <circle cx="1480" cy="72" r="25" fill="#fff2c9" stroke="#d69c29" stroke-width="3"/>
  <g stroke="#d69c29" stroke-width="3">
    <line x1="1480" y1="37" x2="1480" y2="22"/><line x1="1480" y1="107" x2="1480" y2="122"/>
    <line x1="1445" y1="72" x2="1430" y2="72"/><line x1="1515" y1="72" x2="1530" y2="72"/>
  </g>
  <text x="1410" y="150" class="small">东：太阳升起（方向示意）</text>

  <!-- main plan frame -->
  <rect x="45" y="130" width="1510" height="645" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="70" y="168" class="h2">推荐平面布置（俯视概念图）</text>

  <!-- neighbour building flush to left boundary -->
  <rect x="95" y="220" width="235" height="505" fill="#e8e8e8" stroke="#303337" stroke-width="4"/>
  <text x="212" y="455" text-anchor="middle" class="label">邻居房屋</text>
  <text x="212" y="482" text-anchor="middle" class="small">已贴着你的左侧围墙建造</text>
  <text x="212" y="507" text-anchor="middle" class="tiny">邻居生活水、雨水来向</text>

  <!-- property and walls -->
  <rect x="335" y="220" width="1125" height="505" fill="#fffdf8" stroke="#a93632" stroke-width="6"/>
  <text x="355" y="245" class="tiny" fill="#a93632">你的四面围墙：保留，但不作为新主楼承重墙</text>

  <!-- rear drainage corridor -->
  <rect x="348" y="235" width="1098" height="62" fill="#eaf2e9" stroke="#71926f" stroke-width="2"/>
  <text x="895" y="273" text-anchor="middle" class="small" fill="#47714e">后侧排水 / 检修带（暗管）</text>

  <!-- previous buildings demolished footprints -->
  <rect x="560" y="245" width="310" height="38" fill="none" stroke="#9b9b9b" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="715" y="271" text-anchor="middle" class="tiny" fill="#777">原后排瓦房：拆除</text>
  <rect x="930" y="615" width="360" height="80" fill="none" stroke="#9b9b9b" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1110" y="661" text-anchor="middle" class="tiny" fill="#777">原前面房屋：拆除</text>

  <!-- proposed main house -->
  <rect x="600" y="330" width="570" height="245" fill="#c9ddea" stroke="#2f5d79" stroke-width="5"/>
  <text x="885" y="423" text-anchor="middle" class="label" fill="#23465f">新建主楼</text>
  <text x="885" y="452" text-anchor="middle" class="small" fill="#315f7c">主楼四周留通道，不贴围墙</text>
  <text x="885" y="478" text-anchor="middle" class="tiny" fill="#315f7c">基础下不走排水管、不设检查井</text>
  <rect x="846" y="556" width="78" height="19" fill="#2f5d79"/>
  <text x="936" y="571" class="tiny" fill="#315d7a">主入口</text>

  <!-- walkways -->
  <rect x="370" y="315" width="190" height="280" fill="#f3f6f0" stroke="#a4b69e" stroke-width="2"/>
  <text x="465" y="450" text-anchor="middle" class="small" fill="#5c7659">左侧过道</text>
  <text x="465" y="472" text-anchor="middle" class="tiny" fill="#5c7659">建议保持通风、可检修</text>
  <rect x="1210" y="315" width="210" height="280" fill="#f3f6f0" stroke="#a4b69e" stroke-width="2"/>
  <text x="1315" y="450" text-anchor="middle" class="small" fill="#5c7659">右侧过道</text>
  <text x="1315" y="472" text-anchor="middle" class="tiny" fill="#5c7659">排水检查和维修带</text>
  <rect x="370" y="610" width="1050" height="95" fill="#f6f0e5" stroke="#c5ad86" stroke-width="2"/>
  <text x="895" y="657" text-anchor="middle" class="label" fill="#725c39">前院 / 出入空间</text>
  <text x="895" y="681" text-anchor="middle" class="small" fill="#725c39">主门前保持干燥，不让污水流线直冲大门</text>

  <!-- right side gate, separated from outlet -->
  <rect x="1439" y="350" width="25" height="105" fill="#fffdf8"/>
  <line x1="1448" y1="358" x2="1415" y2="400" stroke="#765d43" stroke-width="4"/>
  <line x1="1448" y1="447" x2="1415" y2="405" stroke="#765d43" stroke-width="4"/>
  <text x="1370" y="338" text-anchor="middle" class="small" fill="#765d43">右侧后院门（保留）</text>
  <text x="1370" y="488" text-anchor="middle" class="tiny" fill="#765d43">门下只过封闭承重涵管</text>

  <!-- existing horizontal ditch shown as removed -->
  <line x1="337" y1="305" x2="1458" y2="305" stroke="#9a9a9a" stroke-width="15" stroke-dasharray="24 14" opacity="0.7"/>
  <line x1="337" y1="305" x2="1458" y2="305" stroke="#ad3733" stroke-width="3"/>
  <text x="900" y="323" text-anchor="middle" class="tiny" fill="#a33330">原横向明沟取消，不再贴近新主楼</text>

  <!-- recommended incoming mixed water route: dark sealed pipe around perimeter -->
  <path d="M330 395 L385 395 L385 265 L1410 265 L1410 620 L1458 620" fill="none" stroke="#126f9f" stroke-width="15" marker-end="url(#flow)"/>
  <path d="M330 395 L385 395" fill="none" stroke="#126f9f" stroke-width="20"/>
  <text x="405" y="375" class="small" fill="#126f9f">邻居混合来水</text>
  <text x="405" y="392" class="tiny" fill="#126f9f">上游未分流时，按合流管处理</text>
  <text x="985" y="256" text-anchor="middle" class="small" fill="#126f9f">密闭暗管沿围墙外围绕行：左 → 右</text>
  <text x="1230" y="642" class="tiny" fill="#126f9f">右侧合法排水出口</text>
  <circle cx="385" cy="395" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="385" cy="265" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="1410" cy="265" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="1410" cy="620" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <text x="400" y="422" class="tiny" fill="#126f9f">检查井</text>

  <!-- house own sewer and rain routes -->
  <path d="M1170 520 L1200 520 L1200 585 L1320 585" fill="none" stroke="#9a572c" stroke-width="8" marker-end="url(#brownFlow)"/>
  <rect x="1320" y="562" width="72" height="45" fill="#ead2bd" stroke="#9a572c" stroke-width="3"/>
  <text x="1356" y="581" text-anchor="middle" class="tiny" fill="#7e4826">化粪池/</text>
  <text x="1356" y="597" text-anchor="middle" class="tiny" fill="#7e4826">污水处理</text>
  <text x="1195" y="548" class="tiny" fill="#9a572c">主楼生活污水</text>
  <path d="M610 345 L575 345 L575 600 L535 600" fill="none" stroke="#3c7b4c" stroke-width="7" stroke-dasharray="16 10" marker-end="url(#greenFlow)"/>
  <text x="485" y="615" class="tiny" fill="#3c7b4c">屋面雨水单独排放</text>

  <!-- plan notes -->
  <rect x="70" y="735" width="1460" height="27" fill="#fff4dc" stroke="#cba458" stroke-width="1"/>
  <text x="85" y="754" class="tiny" fill="#624a1e">重要：暗管必须完整密封并可检修；暗管不是简单盖板。穿墙只设一个固定位置，出口与右侧门错开。</text>

  <!-- cross section -->
  <rect x="45" y="805" width="1510" height="225" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="70" y="842" class="h2">围墙旁排水带剖面示意</text>
  <!-- wall -->
  <rect x="120" y="875" width="55" height="110" fill="#c6c6c6" stroke="#555" stroke-width="3"/>
  <text x="147" y="1008" text-anchor="middle" class="small">你的围墙</text>
  <!-- service path -->
  <rect x="175" y="925" width="230" height="60" fill="#edf4e9" stroke="#8da18a" stroke-width="2"/>
  <text x="290" y="953" text-anchor="middle" class="small" fill="#527054">检修过道</text>
  <text x="290" y="971" text-anchor="middle" class="tiny" fill="#527054">不紧贴墙基开深沟</text>
  <!-- pipe -->
  <ellipse cx="490" cy="955" rx="40" ry="23" fill="#126f9f" stroke="#0b4d6f" stroke-width="3"/>
  <text x="490" y="1008" text-anchor="middle" class="small" fill="#126f9f">密闭暗管</text>
  <!-- ground -->
  <line x1="85" y1="985" x2="760" y2="985" stroke="#8a6b4a" stroke-width="4"/>
  <!-- foundation -->
  <rect x="620" y="895" width="90" height="90" fill="#b8c9d6" stroke="#315d7a" stroke-width="3"/>
  <text x="665" y="1008" text-anchor="middle" class="small" fill="#315d7a">主楼基础</text>
  <line x1="530" y1="955" x2="620" y2="955" stroke="#c54c37" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="575" y="925" text-anchor="middle" class="tiny" fill="#a33b2d">安全距离</text>
  <text x="805" y="892" class="small" fill="#3b4146">施工控制要点：</text>
  <text x="805" y="918" class="small" fill="#3b4146">1. 先测围墙基础和地势高差，再确定管道埋深。</text>
  <text x="805" y="944" class="small" fill="#3b4146">2. 不要把管道埋在主楼基础下，也不要利用两墙夹缝排污。</text>
  <text x="805" y="970" class="small" fill="#3b4146">3. 右侧门保持干燥，排水出口放在门的下游并错开。</text>
  <text x="805" y="996" class="small" fill="#3b4146">4. 外侧土地若非你的或非公共排水带，不能自行占用外排。</text>

  <!-- legend -->
  <line x1="70" y1="1045" x2="120" y2="1045" stroke="#126f9f" stroke-width="9"/>
  <text x="130" y="1050" class="tiny">蓝色：邻居混合来水密闭暗管</text>
  <line x1="390" y1="1045" x2="440" y2="1045" stroke="#9a572c" stroke-width="7"/>
  <text x="450" y="1050" class="tiny">棕色：主楼生活污水</text>
  <line x1="690" y1="1045" x2="740" y2="1045" stroke="#3c7b4c" stroke-width="7" stroke-dasharray="15 9"/>
  <text x="750" y="1050" class="tiny">绿色虚线：屋面雨水</text>
  <text x="1110" y="1050" class="tiny" fill="#a33330">本图为概念方案，非施工图；须按当地排水、建筑和消防要求复核。</text>
</svg>
