<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <marker id="flow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#126f9f"/>
    </marker>
    <marker id="brownFlow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#9a572c"/>
    </marker>
    <marker id="greenFlow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3c7b4c"/>
    </marker>
    <style>
      .title { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 31px; font-weight: 700; fill: #202326; }
      .sub { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 16px; fill: #5b6167; }
      .h2 { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 22px; font-weight: 700; fill: #202326; }
      .label { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 17px; fill: #2e3338; }
      .small { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 14px; fill: #555c62; }
      .tiny { font-family: Microsoft YaHei, SimHei, sans-serif; font-size: 12px; fill: #646b71; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f7f5f0"/>
  <text x="55" y="52" class="title">不规则地块小四合院重建与排水方案</text>
  <text x="55" y="82" class="sub">保留四面围墙；后侧设正房、左右厢房和中庭；邻居侧内接排水，穿墙后沿外侧接入公共水道</text>

  <!-- orientation -->
  <circle cx="1480" cy="72" r="25" fill="#fff2c9" stroke="#d69c29" stroke-width="3"/>
  <g stroke="#d69c29" stroke-width="3">
    <line x1="1480" y1="37" x2="1480" y2="22"/><line x1="1480" y1="107" x2="1480" y2="122"/>
    <line x1="1445" y1="72" x2="1430" y2="72"/><line x1="1515" y1="72" x2="1530" y2="72"/>
  </g>
  <text x="1410" y="150" class="small">东：太阳升起（方向示意）</text>

  <!-- plan frame -->
  <rect x="45" y="130" width="1510" height="710" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="70" y="168" class="h2">推荐平面布局（俯视概念图）</text>

  <!-- neighbour -->
  <rect x="90" y="220" width="245" height="520" fill="#e8e8e8" stroke="#303337" stroke-width="4"/>
  <text x="212" y="455" text-anchor="middle" class="label">邻居房屋</text>
  <text x="212" y="482" text-anchor="middle" class="small">贴着你的左侧围墙</text>
  <text x="212" y="508" text-anchor="middle" class="tiny">生活水、雨水从左侧来</text>

  <!-- L-shaped property boundary -->
  <path d="M340 220 L1120 220 L1120 500 L1425 500 L1425 740 L340 740 Z" fill="#fffdf8" stroke="#a93632" stroke-width="6"/>
  <text x="360" y="246" class="tiny" fill="#a93632">你的四面围墙：保留，新房独立基础</text>
  <text x="1150" y="526" class="tiny" fill="#a93632">前方右侧外扩区（约一间房宽）</text>

  <!-- rear main house -->
  <rect x="505" y="285" width="545" height="145" fill="#c9ddea" stroke="#2f5d79" stroke-width="5"/>
  <text x="778" y="352" text-anchor="middle" class="label" fill="#23465f">正房 / 新建主屋</text>
  <text x="778" y="378" text-anchor="middle" class="small" fill="#315f7c">放在后院较窄主体，朝向中庭</text>
  <text x="778" y="402" text-anchor="middle" class="tiny" fill="#315f7c">主屋基础下不走任何排水管</text>

  <!-- courtyard -->
  <rect x="505" y="450" width="545" height="145" fill="#eaf4e5" stroke="#769b6e" stroke-width="3"/>
  <text x="778" y="520" text-anchor="middle" class="label" fill="#416b43">中庭 / 天井</text>
  <text x="778" y="547" text-anchor="middle" class="small" fill="#527054">保持开敞、采光、通风</text>
  <text x="778" y="572" text-anchor="middle" class="tiny" fill="#527054">中庭不设明沟、污水井或排水出口</text>

  <!-- side wings -->
  <rect x="365" y="335" width="115" height="260" fill="#f1dfc7" stroke="#8a6b45" stroke-width="4"/>
  <text x="423" y="445" text-anchor="middle" class="label" fill="#6e512e">左厢房</text>
  <text x="423" y="471" text-anchor="middle" class="tiny" fill="#6e512e">房间 / 储物</text>
  <rect x="1070" y="335" width="40" height="260" fill="#f1dfc7" stroke="#8a6b45" stroke-width="3"/>
  <text x="1090" y="455" text-anchor="middle" class="tiny" fill="#6e512e" transform="rotate(90 1090 455)">右厢房 / 侧廊</text>
  <rect x="480" y="335" width="25" height="260" fill="#f3f6f0" stroke="#a4b69e" stroke-width="2"/>
  <rect x="1050" y="335" width="20" height="260" fill="#f3f6f0" stroke="#a4b69e" stroke-width="2"/>
  <text x="378" y="615" class="tiny" fill="#5c7659">左侧过道</text>
  <text x="1020" y="615" class="tiny" fill="#5c7659">右侧过道</text>

  <!-- front gatehouse / rooms -->
  <rect x="505" y="620" width="545" height="85" fill="#e8d7be" stroke="#80653e" stroke-width="4"/>
  <line x1="675" y1="620" x2="675" y2="705" stroke="#80653e" stroke-width="3"/>
  <line x1="875" y1="620" x2="875" y2="705" stroke="#80653e" stroke-width="3"/>
  <text x="590" y="665" text-anchor="middle" class="small" fill="#6e512e">前房/门房</text>
  <text x="775" y="665" text-anchor="middle" class="small" fill="#6e512e">主门厅</text>
  <text x="962" y="665" text-anchor="middle" class="small" fill="#6e512e">前房/储物</text>
  <rect x="743" y="686" width="70" height="19" fill="#80653e"/>
  <text x="823" y="701" class="tiny" fill="#80653e">前方主门</text>

  <!-- front right extension -->
  <rect x="1125" y="535" width="275" height="170" fill="#f2eee5" stroke="#c5ad86" stroke-width="3"/>
  <text x="1262" y="600" text-anchor="middle" class="label" fill="#725c39">前方右侧外扩区</text>
  <text x="1262" y="626" text-anchor="middle" class="small" fill="#725c39">侧厅 / 车位 / 储物</text>
  <text x="1262" y="650" text-anchor="middle" class="tiny" fill="#725c39">不必强行并入主屋中轴</text>
  <text x="1262" y="674" text-anchor="middle" class="tiny" fill="#725c39">可作为实用附属空间</text>

  <!-- right rear side gate -->
  <rect x="1108" y="365" width="25" height="95" fill="#fffdf8"/>
  <line x1="1118" y1="373" x2="1085" y2="410" stroke="#765d43" stroke-width="4"/>
  <line x1="1118" y1="452" x2="1085" y2="415" stroke="#765d43" stroke-width="4"/>
  <text x="1190" y="355" class="small" fill="#765d43">右侧后院门（保留）</text>
  <text x="1190" y="377" class="tiny" fill="#765d43">作为侧门/维修门</text>

  <!-- cancelled original horizontal ditch -->
  <line x1="340" y1="605" x2="1115" y2="605" stroke="#999" stroke-width="13" stroke-dasharray="22 13" opacity="0.7"/>
  <line x1="340" y1="605" x2="1115" y2="605" stroke="#ad3733" stroke-width="3"/>
  <text x="770" y="615" text-anchor="middle" class="tiny" fill="#a33330">原横向明沟取消，不穿中庭和主屋</text>

  <!-- mixed drain: inside only neighbour side, outside elsewhere -->
  <path d="M335 400 L382 400 L382 245 L420 245 L420 215" fill="none" stroke="#126f9f" stroke-width="15"/>
  <path d="M420 215 L1128 215 L1145 235 L1145 495 L1438 515 L1438 590" fill="none" stroke="#126f9f" stroke-width="15" marker-end="url(#flow)"/>
  <!-- external pipe bands -->
  <rect x="405" y="185" width="715" height="22" fill="#e7eef1"/>
  <rect x="1125" y="220" width="38" height="285" fill="#e7eef1"/>
  <rect x="1135" y="500" width="300" height="31" fill="#e7eef1"/>
  <rect x="1425" y="505" width="35" height="105" fill="#e7eef1"/>
  <text x="760" y="180" text-anchor="middle" class="small" fill="#126f9f">围墙外侧密闭排水带（需确认合法使用权）</text>
  <text x="390" y="375" class="small" fill="#126f9f">邻居贴墙侧唯一内接段</text>
  <text x="390" y="392" class="tiny" fill="#126f9f">先在围墙内接入，再穿墙</text>
  <text x="720" y="235" text-anchor="middle" class="tiny" fill="#126f9f">穿墙一次后沿后侧、右侧外绕</text>
  <circle cx="382" cy="400" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="420" cy="215" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <circle cx="1145" cy="495" r="13" fill="#fff" stroke="#126f9f" stroke-width="3"/>
  <text x="397" y="426" class="tiny" fill="#126f9f">检查井</text>
  <text x="430" y="205" class="tiny" fill="#126f9f">穿墙套管</text>
  <text x="1160" y="492" class="tiny" fill="#126f9f">转弯检查井</text>

  <!-- public connection -->
  <rect x="1400" y="563" width="105" height="55" rx="4" fill="#ed3434" stroke="#9b1c1c" stroke-width="3"/>
  <text x="1452" y="587" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" fill="#fff">红色位置</text>
  <text x="1452" y="606" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#fff">接公共水道</text>
  <text x="1260" y="585" class="small" fill="#126f9f">水流 →</text>

  <!-- building wastewater and rainwater -->
  <path d="M1035 430 L1055 430 L1055 555 L1080 555" fill="none" stroke="#9a572c" stroke-width="8" marker-end="url(#brownFlow)"/>
  <rect x="1080" y="532" width="72" height="45" fill="#ead2bd" stroke="#9a572c" stroke-width="3"/>
  <text x="1116" y="551" text-anchor="middle" class="tiny" fill="#7e4826">化粪池/</text>
  <text x="1116" y="567" text-anchor="middle" class="tiny" fill="#7e4826">污水处理</text>
  <text x="1035" y="516" class="tiny" fill="#9a572c">主屋生活污水</text>
  <path d="M505 300 L475 300 L475 590 L445 590" fill="none" stroke="#3c7b4c" stroke-width="7" stroke-dasharray="16 10" marker-end="url(#greenFlow)"/>
  <text x="365" y="650" class="tiny" fill="#3c7b4c">屋面雨水单独排放</text>

  <!-- plan caution -->
  <rect x="70" y="752" width="1460" height="48" fill="#fff4dc" stroke="#cba458" stroke-width="1"/>
  <text x="85" y="780" class="small" fill="#624a1e">四合院能否落地取决于围墙内净尺寸、退界、采光、消防和抗震要求；本图是布局沟通图，不是施工图。</text>

  <!-- section -->
  <rect x="45" y="840" width="1510" height="220" rx="8" fill="#fff" stroke="#d1d4d7" stroke-width="2"/>
  <text x="70" y="875" class="h2">排水穿墙与新房基础剖面示意</text>
  <rect x="105" y="905" width="50" height="105" fill="#c6c6c6" stroke="#555" stroke-width="3"/>
  <text x="130" y="1032" text-anchor="middle" class="small">你的围墙</text>
  <rect x="155" y="955" width="180" height="55" fill="#edf4e9" stroke="#8da18a" stroke-width="2"/>
  <text x="245" y="987" text-anchor="middle" class="small" fill="#527054">内侧过道</text>
  <rect x="335" y="955" width="185" height="55" fill="#e7eef1" stroke="#8ba9b8" stroke-width="2"/>
  <text x="427" y="987" text-anchor="middle" class="small" fill="#126f9f">墙外排水带</text>
  <ellipse cx="570" cy="982" rx="43" ry="24" fill="#126f9f" stroke="#0b4d6f" stroke-width="3"/>
  <text x="570" y="1032" text-anchor="middle" class="small" fill="#126f9f">密闭暗管</text>
  <line x1="75" y1="1010" x2="760" y2="1010" stroke="#8a6b4a" stroke-width="4"/>
  <rect x="675" y="920" width="95" height="90" fill="#b8c9d6" stroke="#315d7a" stroke-width="3"/>
  <text x="723" y="1032" text-anchor="middle" class="small" fill="#315d7a">主屋基础</text>
  <line x1="615" y1="982" x2="675" y2="982" stroke="#c54c37" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="645" y="950" text-anchor="middle" class="tiny" fill="#a33b2d">安全距离</text>
  <text x="825" y="925" class="small" fill="#3b4146">施工重点：</text>
  <text x="825" y="950" class="small" fill="#3b4146">1. 只有邻居贴墙侧先在围墙内接水，穿墙后走外侧。</text>
  <text x="825" y="974" class="small" fill="#3b4146">2. 红色位置接公共水道，右侧门与接入口错开。</text>
  <text x="825" y="998" class="small" fill="#3b4146">3. 上游混合水不能在院内凭空分流；按合流管和暴雨流量设计。</text>
  <text x="825" y="1022" class="small" fill="#3b4146">4. 外绕路线需确认土地/公共排水带使用权，且不得破坏围墙基础。</text>

  <!-- legend -->
  <line x1="70" y1="1080" x2="120" y2="1080" stroke="#126f9f" stroke-width="9"/>
  <text x="130" y="1085" class="tiny">蓝色：邻居混合来水密闭暗管</text>
  <line x1="390" y1="1080" x2="440" y2="1080" stroke="#9a572c" stroke-width="7"/>
  <text x="450" y="1085" class="tiny">棕色：主屋生活污水</text>
  <line x1="690" y1="1080" x2="740" y2="1080" stroke="#3c7b4c" stroke-width="7" stroke-dasharray="15 9"/>
  <text x="750" y="1085" class="tiny">绿色虚线：屋面雨水</text>
  <text x="1120" y="1085" class="tiny" fill="#a33330">正式设计须按当地建筑、排水、消防和抗震规范复核。</text>
</svg>
